# Manual method-body mutation spot-check (ADR-0008 / [ticket]). NOT a CI job.
#
# The mutmut dogfood ("Mutation testing (mutmut, advisory)") mutates module-level functions only;
# cosmic-ray covers the class-method bodies it can't. cosmic-ray is ~30x slower per mutant and
# mutates in place, so run it by hand, on demand, after committing. It is not a dev dependency —
# invoke it throwaway in the project env (so gdmutant is importable) with uv:
#
#   uv run --with cosmic-ray cosmic-ray init cosmic-ray.toml cr-session.sqlite
#   uv run --with cosmic-ray cosmic-ray exec cosmic-ray.toml cr-session.sqlite
#   uv run --with cosmic-ray cr-report cr-session.sqlite      # survivors + kill rate
#
# `module-path` targets the core mutation model's method bodies (Mutant.apply, ...). Point it at
# another method-heavy file for a different check — e.g. gdmutant/engine/runner.py (CommandRunner.run,
# SuiteResult.failed/passed), gdmutant/adapters/gdscript/runner.py (GdUnit4Runner.run/command),
# gdmutant/engine/spans.py. See docs/mutation-testing.md for the full recipe.
[cosmic-ray]
module-path = "gdmutant/engine/mutants.py"
timeout = 30.0
excluded-modules = []
test-command = "python -m pytest -x -q --no-cov -p no:cacheprovider"

[cosmic-ray.distributor]
name = "local"
