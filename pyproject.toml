# gdmutant — packaging + tooling config (single source of truth for the toolchain).
# pyproject over an executable setup.py; deps hash-pinned in uv.lock and
# installed with `uv sync --frozen`.

[project]
name = "gdmutant"
version = "0.1.0"                       # the packaged version (see CHANGELOG.md). A release tag
                                        # must declare the same number — scripts/check_release_tag.py
                                        # fails the release path otherwise.
description = "An AST-based, language-agnostic mutation-testing tool for GDScript/Godot."
# `readme` is dynamic, not a static path: the long description is README.md with its relative
# image paths rewritten to absolute ones at build time. See the fancy-pypi-readme hook below.
dynamic = ["readme"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kphutt" }]
keywords = ["mutation-testing", "gdscript", "godot", "testing", "test-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  # 3.13 is claimed because the full suite was run on it from this lockfile (all tests pass, the
  # 100% line+branch floor holds), not because `requires-python` allows it. CI still gates on
  # 3.12; add a version here only after running the suite on it.
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Runtime dependencies (both MIT — recorded in docs/credits.md):
# - gdtoolkit ships the real GDScript parser the adapter mutates (see docs/decisions/0001).
# - lark: the adapter imports its Token/Tree/LarkError types directly, so it is a declared
#   direct dependency, not only a gdtoolkit transitive one.
dependencies = [
  "gdtoolkit>=4.5,<5",
  "lark>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/kphutt/gdmutant"
Repository = "https://github.com/kphutt/gdmutant"
Issues = "https://github.com/kphutt/gdmutant/issues"
# CHANGELOG.md, not /releases: the file is written per version and reads top-to-bottom, which is
# what someone following this link from PyPI wants.
Changelog = "https://github.com/kphutt/gdmutant/blob/main/CHANGELOG.md"

[project.scripts]
# The standalone CLI a developer runs — usable without any AI.
gdmutant = "gdmutant.cli:main"

# Dev toolchain (PEP 735 group; installed by `uv sync` by default).
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pip-licenses>=5",
  "mutmut>=3.6.0",
  "pre-commit>=4",
  "poodle>=1.3.4",
]

[tool.uv]
# Pin uv itself: the toolchain is uv-first, and Python is pinned via .python-version. Older uv
# releases can resolve the lockfile differently, so require a floor.
required-version = ">=0.11"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1.0"]
build-backend = "hatchling.build"

# --- The README banner, on GitHub *and* PyPI, with no launch-day edit ---------------------------
#
# THE PROBLEM. README.md is both the repo's front page and the PyPI long description, and the two
# surfaces resolve image paths differently:
#
#   - A RELATIVE path (`.github/assets/banner.svg`) renders on GitHub whether the repo is private
#     or public, because GitHub resolves it against the repo using the *viewer's* session.
#     `readme_renderer` does not resolve relative paths at all: it hands the literal string to
#     PyPI's camo proxy, which hex-encodes it and 404s.
#   - An ABSOLUTE raw.githubusercontent.com URL works on PyPI and on public GitHub, but 404s while
#     the repo is private, because camo fetches with no credentials.
#
# So one literal string in the file cannot serve both. The fix is to stop making it one string:
# the file on disk keeps the relative path (GitHub, private and public), and this hook rewrites it
# to an absolute URL *only* in the built distribution's long description (PyPI). One source file,
# config-as-code, and nothing to remember to change when the repo goes public.
#
# A data: URI was the obvious alternative and does NOT work: readme_renderer's sanitiser allows
# only `url_schemes={"http", "https", "mailto"}`, so PyPI strips the image entirely.
#
# WHY THE URL IS PINNED TO THE TAG, not to `main`. `$HFPR_VERSION` is substituted with the packaged
# version at build time, producing `.../v0.1.0/...` — matching the `vX.Y.Z` tag that
# scripts/check_release_tag.py already forces to agree with the version above. A PyPI release is
# immutable, so its page should keep showing the banner *that release shipped with*; pointing at
# `main` would retroactively restyle every past release's page. The one cost: a
# `workflow_dispatch` TestPyPI dry-run builds from an untagged commit, so the banner 404s on the
# TestPyPI page until the tag exists. That is a rehearsal surface only.
#
# The asset itself deliberately does not ship in the sdist (see the allowlist above) — PyPI fetches
# it from GitHub, never from the installed package.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Anchored to `src="` so this only ever rewrites an image/link target, never a prose or code-block
# mention of the same path. tests/test_packaging.py asserts this pattern still matches what
# README.md actually contains, so renaming the asset fails the suite instead of silently shipping
# a relative path to PyPI again.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="\.github/assets/'
replacement = 'src="https://raw.githubusercontent.com/kphutt/gdmutant/v$HFPR_VERSION/.github/assets/'

[tool.hatch.build.targets.wheel]
packages = ["gdmutant"]

[tool.hatch.build.targets.sdist]
# An explicit allowlist of what ships in the sdist — the package (incl. its `py.typed` marker), the
# test suite, docs, the corpus, and the contributor/meta docs. An allowlist (not a deny-list) is the
# robust fix for hatchling otherwise bundling local, untracked, or dot-prefixed state into the
# distribution: only these paths ship (plus hatchling's own force-included `.gitignore`, a tracked,
# harmless file), so no local agent/editor state leaks in and no tooling directory has to be named.
# Contributor docs stay because `docs/using-with-an-ai-agent.md` links to AGENTS.md and the in-repo
# link-resolution test asserts it exists.
# The README's mascot image (`.github/assets/frank.{svg,png}`) is deliberately NOT here: PyPI reads
# the raw README source for its project-page render and fetches the image itself from an absolute
# GitHub URL, never from the installed package's own files — so shipping it in the sdist would only
# add bytes to every install with no rendering benefit. `.github/` already ships nothing (see the
# test below), which is the right home for a repo/README-only asset.
include = [
  "/gdmutant",
  "/tests",
  "/corpus",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/AGENTS.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# mutmut writes a generated copy of the project here while it runs; never lint/format it.
extend-exclude = ["mutants"]

[tool.ruff.lint]
# A pragmatic-but-real invariant set (not just style): pyflakes, pycodestyle,
# isort, bugbear, comprehensions, pyupgrade, simplify.
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
# mutmut's generated copy of the source (created only while it runs) must not be type-checked.
exclude = ["^mutants/"]

[[tool.mypy.overrides]]
# gdtoolkit ships no type stubs / py.typed marker; treat it as untyped at the adapter boundary.
module = ["gdtoolkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gdmutant --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["gdmutant"]

[tool.coverage.report]
# The suite is written to 100% line+branch coverage; enforce that floor so a drop fails the run
# (pytest-cov reads this) instead of silently sliding. `--cov-report=term-missing` (in addopts)
# already prints the uncovered lines, so no `show_missing` here. Test-only files aren't measured
# (source = gdmutant above).
fail_under = 100

[tool.mutmut]
# Mutation-test gdmutant's own library with mutmut (dogfood).
source_paths = ["gdmutant"]
# mutmut runs the suite from a copied "mutants/" tree, and copies into it only what this list
# names (plus its own defaults: tests/, pyproject.toml, setup.cfg). A test that reads a file at the
# repository root therefore passes a normal `pytest` run and raises FileNotFoundError under mutmut
# -- which fails the BASELINE, so mutmut aborts and evaluates zero mutants. The score does not drop;
# it stops existing. That has happened three times now (.pre-commit-config.yaml, poodle.toml,
# action.yml), each time from an ordinary new test whose author had no reason to think about this
# file. So the list is no longer maintained by memory: tests/test_mutation_baseline_inputs.py reads
# every test module, works out which repository entries the suite reaches for, and fails naming the
# missing one. Add an entry when that test says to. (Skip coverage below -- pure per-mutant
# overhead.)
also_copy = [
    "corpus",
    "docs",
    "AGENTS.md",
    "README.md",
    "scripts",
    ".github",
    ".pre-commit-config.yaml",
    "poodle.toml",
    "action.yml",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
