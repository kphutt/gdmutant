# gdmutant — packaging + tooling config (single source of truth for the toolchain).
# pyproject over an executable setup.py; deps hash-pinned in uv.lock and
# installed with `uv sync --frozen`.

[project]
name = "gdmutant"
version = "0.1.0"                       # current in-development version; the first tag is pending
                                        # (see CHANGELOG.md). Engine + CLI are built and validated
                                        # against real Godot in CI.
description = "An AST-based, language-agnostic mutation-testing tool for GDScript/Godot."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kphutt" }]
keywords = ["mutation-testing", "gdscript", "godot", "testing", "test-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Runtime dependencies (both MIT — recorded in CREDITS.md):
# - gdtoolkit ships the real GDScript parser the adapter mutates (see docs/decisions/0001).
# - lark: the adapter imports its Token/Tree/LarkError types directly, so it is a declared
#   direct dependency, not only a gdtoolkit transitive one.
dependencies = [
  "gdtoolkit>=4.5,<5",
  "lark>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/kphutt/gdmutant"
Repository = "https://github.com/kphutt/gdmutant"
Issues = "https://github.com/kphutt/gdmutant/issues"
Changelog = "https://github.com/kphutt/gdmutant/releases"

[project.scripts]
# The standalone CLI a developer runs — usable without any AI.
gdmutant = "gdmutant.cli:main"

# Dev toolchain (PEP 735 group; installed by `uv sync` by default).
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pip-licenses>=5",
  "mutmut>=3.6.0",
  "pre-commit>=4",
  "poodle>=1.3.4",
]

[tool.uv]
# Pin uv itself: the toolchain is uv-first, and Python is pinned via .python-version. Older uv
# releases can resolve the lockfile differently, so require a floor.
required-version = ">=0.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdmutant"]

[tool.hatch.build.targets.sdist]
# An explicit allowlist of what ships in the sdist — the package (incl. its `py.typed` marker), the
# test suite, docs, the corpus, and the contributor/meta docs. An allowlist (not a deny-list) is the
# robust fix for hatchling otherwise bundling local, untracked, or dot-prefixed state into the
# distribution: only these paths ship (plus hatchling's own force-included `.gitignore`, a tracked,
# harmless file), so no local agent/editor state leaks in and no tooling directory has to be named.
# Contributor docs stay because `docs/agent-guide.md` links to AGENTS.md and the in-repo
# link-resolution test asserts it exists.
include = [
  "/gdmutant",
  "/tests",
  "/corpus",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CREDITS.md",
  "/AGENTS.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# mutmut writes a generated copy of the project here while it runs; never lint/format it.
extend-exclude = ["mutants"]

[tool.ruff.lint]
# A pragmatic-but-real invariant set (not just style): pyflakes, pycodestyle,
# isort, bugbear, comprehensions, pyupgrade, simplify.
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
# mutmut's generated copy of the source (created only while it runs) must not be type-checked.
exclude = ["^mutants/"]

[[tool.mypy.overrides]]
# gdtoolkit ships no type stubs / py.typed marker; treat it as untyped at the adapter boundary.
module = ["gdtoolkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gdmutant --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["gdmutant"]

[tool.coverage.report]
# The suite is written to 100% line+branch coverage; enforce that floor so a drop fails the run
# (pytest-cov reads this) instead of silently sliding. `--cov-report=term-missing` (in addopts)
# already prints the uncovered lines, so no `show_missing` here. Test-only files aren't measured
# (source = gdmutant above).
fail_under = 100

[tool.mutmut]
# Mutation-test gdmutant's own library with mutmut (dogfood).
source_paths = ["gdmutant"]
# mutmut runs the suite from a copied "mutants/" tree; tests read the corpus (end-to-end),
# docs/ (the guide-consistency test), AGENTS.md (the guide links to ../AGENTS.md and the
# link-resolution test checks it exists), scripts/ (the license and release-tag guards are loaded
# from there by their tests), .github/ (the release workflow's on-main guard is read, and
# executed, straight out of its YAML), and .pre-commit-config.yaml (test_local_check_parity.py
# diffs its hook entries against ci.yml's verify job — found live: omitting it here doesn't
# survive-a-mutant-wrongly, it aborts collection for the WHOLE suite, so mutmut evaluates zero
# mutants and the advisory job goes red with no score at all). Anything the suite reads and this
# list omits fails *collection*, which aborts the baseline — mutmut then evaluates zero mutants,
# and the advisory job is red with no score rather than wrong. Skip coverage — it is pure
# overhead per mutant run.
also_copy = ["corpus", "docs", "AGENTS.md", "README.md", "scripts", ".github", ".pre-commit-config.yaml"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
