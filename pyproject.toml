# gdmutant — packaging + tooling config (single source of truth for the toolchain).
# pyproject over an executable setup.py; deps hash-pinned in uv.lock and
# installed with `uv sync --frozen`.

[project]
name = "gdmutant"
version = "0.0.0"                       # pre-0.1: no engine yet. Bumps to 0.1.0 when
                                        # it mutates real code + prints survivors.
description = "An AST-based, language-agnostic mutation-testing tool for GDScript/Godot."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karsten Huttelmaier" }]
keywords = ["mutation-testing", "gdscript", "godot", "testing", "test-quality"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

# Runtime dependency: gdtoolkit ships the real GDScript parser the adapter mutates
# (see docs/decisions/0001). MIT-licensed — recorded in CREDITS.md.
dependencies = [
  "gdtoolkit>=4.5,<5",
]

[project.urls]
Repository = "https://github.com/kphutt/gdmutant"

[project.scripts]
# The standalone CLI a developer runs — usable without any AI.
gdmutant = "gdmutant.cli:main"

# Dev toolchain (PEP 735 group; installed by `uv sync` by default).
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdmutant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# A pragmatic-but-real invariant set (not just style): pyflakes, pycodestyle,
# isort, bugbear, comprehensions, pyupgrade, simplify.
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gdmutant --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["gdmutant"]
