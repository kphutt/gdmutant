[tools]
# Pins Godot for the env-gated live self-test suites (tests/test_selftest_live.py) — the only
# checks that run gdmutant's real adapter against a real Godot binary. Matches the exact patch CI
# pins via chickensoft-games/setup-godot (4.7.0); Godot's own release tagging calls that
# "4.7-stable" (see `godot --version`: 4.7.stable.official.<hash>).
#
# mise owns Godot only — Python stays owned by uv (.python-version + uv.lock), never mise; see
# AGENTS.md's tech-stack note.
"aqua:godotengine/godot" = "4.7-stable"

# Pins node for tests/test_htmlreport_behaviour.py, which drives the HTML report's real inlined
# JavaScript via a real `node` subprocess (see that file's own header comment). Same version
# ci.yml's `verify` job installs via actions/setup-node, so a local `mise install` and CI run the
# identical interpreter. `scripts/verify_local.py` only replays ci.yml's `run:` steps -- it never
# provisions `uses:` steps like setup-node -- so this pin is what makes node actually present on a
# local machine running that script.
node = "22.14.0"
