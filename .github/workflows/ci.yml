name: CI

# Security checks + the Python verify gate.
# Trigger on pull_request (never pull_request_target — that would run fork code
# with repo secrets). Scope push to main only.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level; jobs opt into more only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Security spine: secret scanning from commit #1 -----------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Verify: lint + typecheck + tests + supply-chain audit ----------------
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # uv installs the exact locked deps (hashes) — reproducible across machines.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Lint only the fixture's own GDScript (not the downloaded addon). gdlint ships with gdtoolkit,
      # already in the lockfile — a step, not a separate job.
      - name: Lint GDScript fixture (gdlint)
        run: uv run gdlint corpus/turn_order.gd corpus/test corpus/harness

      - name: Typecheck (mypy)
        run: uv run mypy gdmutant

      - name: Tests + coverage
        run: uv run pytest

      - name: Supply-chain audit (pip-audit)
        run: uv run pip-audit

  # --- Live self-test: real Godot, end-to-end (closes [ticket]) ----------------
  # Drives the shipped gdmutant CLI (via subprocess) against a real godot binary + the corpus,
  # pinning EXACT per-mutant outcomes. This is the only check that proves the godot --headless path
  # works against real Godot rather than a mock. One plain job (no matrix): a 2nd supported Godot
  # version later adds a matrix + a finalize gate together — neither earns its keep for one version.
  # Godot is pinned to an exact patch (semver resolution is an API-rate-limit + silent-drift vector);
  # the mutation outcomes are Godot-version-independent for this pure-logic fixture.
  selftest-godot:
    name: Self-test (real Godot)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false

      # Fail loudly here if the binary/PATH isn't what we expect — not as a confusing skip at step N.
      - name: Godot smoke check
        run: godot --version

      - name: Install GdUnit4 addon (pinned commit + tree-hash verified)
        run: scripts/install-gdunit4.sh

      # On failure the test prints the full per-mutant table + gdmutant's stdout/stderr, so a red run
      # is diagnosable from this log alone. --no-cov: this job runs only the live test in isolation.
      - name: Live self-test (real Godot)
        run: GDMUTANT_GODOT=godot uv run pytest tests/test_selftest_live.py -v --no-cov

      # A downloadable Stryker report of the corpus — the "run the real thing" demo artifact.
      - name: Generate corpus mutation report
        if: always()
        run: |
          # Warm Godot's import cache for the checked-out corpus so GdUnit4 can resolve
          # `class_name TurnOrder` — the self-test only warms its own tmp copy, not this dir.
          # --import's exit code is ignored (quirky across versions); the run below is the real check
          # and is NOT `|| true`-swallowed, so a broken demo shows up instead of a silent empty upload.
          godot --headless --path corpus --import || true
          GDMUTANT_GODOT=godot uv run python -m gdmutant.cli run corpus/turn_order.gd \
            --project corpus --runner gdunit4 --godot godot --json report.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-mutation-report
          path: report.json
          if-no-files-found: warn

  # --- Mutation testing (dogfood): advisory, never blocks the merge ---------
  # Reports gdmutant's own mutation score on the run summary. continue-on-error + NOT a required
  # status check, so a surviving mutant never fails CI. See docs/mutation-testing.md.
  mutation:
    name: Mutation testing (mutmut, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Run mutmut (report mode)
        # Surviving mutants make `mutmut run` exit non-zero — expected here (documented equivalents),
        # so that alone must not fail the step. But a *baseline* failure (the suite doesn't run
        # cleanly unmutated) ALSO aborts mutmut, and a bare `|| true` would mask it as a green
        # advisory run ([ticket]). Keep the run non-fatal, but re-raise the baseline signature.
        run: |
          uv run mutmut run > mutmut-run.log 2>&1 || true
          cat mutmut-run.log
          # mutmut 3 prints "failed to collect stats" (two variants) and exits 1 when the baseline
          # can't be established — the exact signature the `|| true` above would otherwise swallow.
          if grep -qiF "failed to collect stats" mutmut-run.log; then
            echo "::error::mutmut baseline failed — could not collect stats (the suite does not run cleanly unmutated); any advisory score would be meaningless."
            exit 1
          fi

      - name: Summarize the mutation score
        if: always()
        run: |
          uv run mutmut export-cicd-stats || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          stats = pathlib.Path("mutants/mutmut-cicd-stats.json")
          d = json.loads(stats.read_text()) if stats.exists() else {}
          killed, survived = d.get("killed", 0), d.get("survived", 0)
          evaluated = killed + survived + d.get("timeout", 0) + d.get("suspicious", 0)
          # A baseline failure (or a missing/empty stats file) means mutmut evaluated ZERO mutants —
          # indistinguishable from "all killed" unless we check. Fail loudly instead of masking it
          # as a green advisory run ([ticket]); a real run always evaluates >0 mutants.
          if evaluated == 0:
              print("## Mutation testing (mutmut) — BASELINE FAILED ⚠️")
              print()
              print("mutmut evaluated **0 mutants** — the suite does not run cleanly unmutated, so "
                    "no score exists. This advisory job is red on purpose ([ticket]).")
              sys.exit(1)
          scored = killed + survived
          score = f"{100 * killed / scored:.1f}%" if scored else "n/a"
          print("## Mutation testing (mutmut) — advisory")
          print()
          print(f"- **Score:** {score}  ({killed} killed / {scored} killable)")
          print(f"- **Survivors:** {survived} — documented equivalents in `docs/mutation-testing.md`")
          PY
