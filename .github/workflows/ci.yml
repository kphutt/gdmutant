name: CI

# Security checks + the Python verify gate.
#
# NOT AUTO-TRIGGERED WHILE PRIVATE (ADR-0012). This ran on every `pull_request` + push to `main`
# — every one of gdmutant's five jobs billed at least its own 1-minute minimum, and at ~12 runs/day
# that alone approached this account's whole 3,000-min/month included allowance, on a repo that
# doesn't ship anything on merge (only a tag push + a human "Publish" click ships, and that path is
# gated separately — see publish.yml). Merge-time checks now run locally instead
# (.pre-commit-config.yaml, pre-push stage — same commands, not a reimplementation, so local and
# whatever runs here later cannot drift). publish.yml's release-time gate runs these same jobs live,
# in the cloud, unconditionally, on the exact commit being published — a check gating a shipped
# artifact must be one no local machine state can skip, so THAT path stays cloud regardless.
#
# TRIVIAL TO RE-ENABLE, BY DESIGN. Nothing about the jobs below changed to make this possible —
# only this trigger block did. Once gdmutant is public, Actions is free and unlimited, and you'd
# want this running automatically again for contributor-facing PR visibility. Restore it with:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
# and remove `workflow_dispatch` below (or keep both — a manual trigger doesn't hurt).
on:
  workflow_dispatch: # manual only — Actions -> CI -> "Run workflow", for an ad-hoc cloud check

# Least privilege at the workflow level; jobs opt into more only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Security spine: secret scanning from commit #1, + the Godot path filter ----------------------
  # Two action-only workloads share one job because GitHub bills every job rounded UP to a full
  # minute: gitleaks and the paths-filter each do seconds of work, so running them as separate jobs
  # cost two billed minutes to do well under one. They are merged here not because they are related,
  # but because neither fills a minute on its own.
  #
  # This job's `name:` WAS a branch-protection required check ("Secret scan (gitleaks)") while this
  # workflow ran automatically — removed from required checks in the same change that removed the
  # `on: pull_request`/`push` triggers above (ADR-0012), since a required check whose workflow
  # never fires blocks every PR forever. If you restore the triggers, restore this to required
  # checks too, and keep the name exactly "Secret scan (gitleaks)" if you do — the paths-filter was
  # merged INTO this job (not the reverse) precisely so that name wouldn't need to change again.
  #
  # The two steps' checkout needs turned out to be compatible, and in the safer direction:
  # `fetch-depth: 0` (which gitleaks already required) leaves the full local history on the runner,
  # so dorny/paths-filter finds every ref it needs locally and never runs the authenticated
  # `git fetch` that forced the old `changes` job to keep credentials on disk. See the step comment.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed by BOTH steps now: gitleaks-action reads the PR's commit range, and dorny/paths-filter
      # reads the PR's changed-files list via the REST API on pull_request runs. (Keep this comment on
      # the same line — zizmor's pedantic `undocumented-permissions` only sees a trailing comment.)
      pull-requests: read # gitleaks reads the PR's commit range; paths-filter reads its changed-files list
    outputs:
      godot: ${{ steps.filter.outputs.godot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # gitleaks scans the already-fetched local history and authenticates to the API via the
          # GITHUB_TOKEN env below — it never runs authenticated git ops, so don't persist the token
          # into .git/config where it could be packed into an artifact (zizmor: artipacked).
          #
          # paths-filter is fine with this too, and that is a strict improvement on the old `changes`
          # job, which needed `persist-credentials: true` only because its shallow (depth-1) checkout
          # forced an authenticated base-commit fetch on this private repo (#119). With the full
          # history here, no fetch happens at all:
          #   - pull_request runs: the action uses the REST API (its `token` input defaults to
          #     github.token) and never touches git.
          #   - push-to-main runs: it diffs the event's `before` SHA against `main`. `fetch-depth: 0`
          #     puts that commit AND refs/remotes/origin/main on disk, so the action's
          #     `ensureRefAvailable` resolves both locally and skips its fetch fallback.
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Path filter: does this PR touch anything the real-Godot self-tests could care about? ----
      # Consumed by both self-test worker jobs below via `needs.secret-scan.outputs.godot`.
      # "Godot-relevant" = source, tests, the corpus fixture, the addon-install scripts the worker
      # jobs run, locked deps, or this workflow file itself. A docs-only PR (README, ROADMAP,
      # decisions/) changes none of these, so the heavy jobs can be skipped. The filter list is
      # byte-for-byte the one from the standalone `changes` job this replaces.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            godot:
              - "gdmutant/**"
              - "tests/**"
              - "corpus/**"
              - "scripts/install_gdunit4.py"
              - "scripts/install_gut.py"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"

  # --- Verify: lint + typecheck + tests + supply-chain audit ----------------
  verify:
    name: Verify
    # gdmutant is a cross-platform CLI shipped to Windows users. A Windows-only cp1252 console
    # encoding bug once shipped *because* CI was Linux-only, so this fast, Godot-free gate runs on
    # both Linux and Windows to catch that bug class (encoding + path). Both runners are pinned
    # (never `-latest`) so a runner-image migration can't silently break us. macOS is intentionally
    # out — there is no macOS-specific code path to guard, and it would only add cost.
    # Linux only. Windows was removed from this matrix to control Actions cost — Windows
    # runners bill at 2x the Linux rate and this matrix was the largest line in a month that
    # hit 100% of the budget (at which point Actions stops running and the gates go quiet).
    #
    # The Windows coverage is NOT abandoned. The encoding/path bug class it guards — a cp1252
    # console bug shipped once because CI was Linux-only — is covered two ways now: on the
    # maintainer's own Windows machine as a discipline (`uv run python scripts/verify_local.py`,
    # see AGENTS.md's Conventions section), and, as of ADR-0012, as an actual MECHANICAL gate:
    # publish.yml runs this exact `verify` job's steps live, on both Linux and Windows runners,
    # before anything reaches PyPI. That closes the old gap — "nothing enforces that mechanically,
    # so it is a discipline, not a gate" no longer describes the Windows leg once a release ships.
    #
    # `Verify (windows-2025)` was removed from branch protection's required checks in the same
    # change — a required check that can never report blocks every PR forever. This job's whole
    # `on:` trigger is now also disabled for the same reason (ADR-0012) — see the top of this file.
    #
    # To restore Windows to THIS workflow (not the same thing as publish.yml's copy, which already
    # covers both OSes): put `windows-2025` back in the matrix below AND re-add
    # `Verify (windows-2025)` to the required checks. Both, or the gate is theatre.
    #
    # The single-entry matrix is deliberate: it keeps this job's check name
    # `Verify (ubuntu-24.04)`, which WAS a required status check on main until ADR-0012 removed
    # required checks alongside this workflow's triggers (see the top of this file). Dropping the
    # matrix would rename the check to `Verify` — if triggers and required checks are ever
    # restored together, the renamed check would never match, blocking every PR forever. It also
    # makes restoring Windows a one-word edit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv installs the exact locked deps (hashes) — reproducible across machines.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        # Force bash: this is the only multi-command step, and GitHub's default Windows shell
        # (pwsh) does not stop on a native command's non-zero exit — only the last line's code is
        # returned, so a `ruff check` failure could be masked by a passing `ruff format --check`.
        # bash (errexit + pipefail, GitHub's Linux default) fails the step on the first error on
        # both OSes. Every other step runs a single command, where this divergence can't occur.
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Lint only the fixture's own GDScript (not the downloaded addon). gdlint ships with gdtoolkit,
      # already in the lockfile — a step, not a separate job.
      - name: Lint GDScript fixture (gdlint)
        run: uv run gdlint corpus/turn_order.gd corpus/test corpus/gut_test corpus/harness

      - name: Typecheck (mypy)
        run: uv run mypy gdmutant

      - name: Tests + coverage
        run: uv run pytest

      - name: Supply-chain audit (pip-audit)
        run: uv run pip-audit

  # --- License compliance: what we SHIP must stay redistributable under MIT ---
  # Its own job, not a `verify` step, because the gate must see only the *shipped* dependency
  # closure and so installs with `--no-dev`. Doing that inside verify would tear out the very dev
  # tools that job needs. Linux-only and unmatrixed: a package's license does not vary by platform.
  license-check:
    name: License compliance
    runs-on: ubuntu-24.04 # pinned (not -latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      # --no-dev: a copyleft *dev* tool is perfectly legal to use and must not fail this gate.
      # Only what a user installs alongside gdmutant affects distribution compliance.
      - name: Install shipped dependencies only (no dev group)
        run: uv sync --frozen --no-dev

      # --with pip-licenses layers the scanner on top without adding it to the locked runtime set;
      # the script excludes it (and its two deps) from the report so the output stays honest about
      # what actually ships.
      - name: License gate
        run: uv run --no-sync --with pip-licenses python scripts/check_licenses.py

  # --- Reporter shim: "Self-test (real Godot)" ------------------------------------------------------
  # WAS a branch-protection required check ("Self-test (real Godot)" — this job's `name:`) while this
  # workflow ran automatically; removed from required checks alongside the `on:` trigger at the top
  # of this file (ADR-0012) — a required check whose workflow never fires blocks every PR forever.
  # The shape stays: this job carries the name and always runs; the actual Godot work is in
  # `selftest-godot-run` below, which is path-filtered and NOT itself a required check, so skipping
  # it is safe. `if: always()` makes this gate run even when its path-filtered dependency was
  # skipped rather than cascading to skip too. If you restore the trigger, restore this to required
  # checks too — the two-job split (a shim that always reports + a filtered worker) is what makes a
  # path-filtered job compatible with being required at all; see the note on `selftest-godot-run`.
  selftest-godot:
    name: Self-test (real Godot)
    needs: [selftest-godot-run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report worker result
        # "skipped" (docs-only PR, path filter didn't match) passes the gate same as "success"; only
        # a genuine "failure"/"cancelled" from the worker fails it. The result goes through env:, not
        # directly into the script, so the expansion isn't a template-injection sink (zizmor).
        env:
          RESULT: ${{ needs.selftest-godot-run.result }}
        run: |
          echo "selftest-godot-run result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi

  # --- Live self-test: real Godot, end-to-end ----------------
  # Drives the shipped gdmutant CLI (via subprocess) against a real godot binary + the corpus,
  # pinning EXACT per-mutant outcomes. This is the only check that proves the godot --headless path
  # works against real Godot rather than a mock. One plain job (no matrix): a 2nd supported Godot
  # version later adds a matrix + a finalize gate together — neither earns its keep for one version.
  # Godot is pinned to an exact patch (semver resolution is an API-rate-limit + silent-drift vector);
  # the mutation outcomes are Godot-version-independent for this pure-logic fixture.
  #
  # NOT a required check itself — path-filtered, gated behind `selftest-godot` above, which always
  # reports.
  selftest-godot-run:
    name: Self-test (real Godot) [worker]
    # The Godot path filter lives in the `secret-scan` job (merged there to save a billed minute);
    # this depends on it for the filter output only.
    needs: secret-scan
    if: needs.secret-scan.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          # The action caches the Godot download itself (keyed on version + platform). Kept explicit
          # so it can't silently regress to a re-download; verified restoring from cache in CI.
          cache: true

      # Fail loudly here if the binary/PATH isn't what we expect — not as a confusing skip at step N.
      - name: Godot smoke check
        run: godot --version

      - name: Install GdUnit4 addon (pinned commit + tree-hash verified)
        run: python scripts/install_gdunit4.py

      # On failure the test prints the full per-mutant table + gdmutant's stdout/stderr, so a red run
      # is diagnosable from this log alone. --no-cov: this job runs only the live test in isolation.
      # --basetemp keeps pytest's tmp tree in the workspace so the next step can reuse the Stryker
      # JSON this run already wrote, instead of booting Godot to regenerate the identical report.
      - name: Live self-test (real Godot)
        run: GDMUTANT_GODOT=godot uv run pytest tests/test_selftest_live.py -v --no-cov --basetemp=.live-tmp

      # A downloadable Stryker report of the corpus — the "run the real thing" demo artifact.
      # Reuse the JSON the live self-test already wrote (--basetemp=.live-tmp) instead of booting
      # Godot and re-running the identical 18-mutant pass: same report, one corpus run instead of
      # two (coverage-neutral, ~30s saved). The test targets a tmp copy, so its single file key is
      # an absolute tmp path — normalize it back to the repo-relative path the old step produced.
      - name: Publish the corpus mutation report (reuse the self-test run)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, sys

          hits = glob.glob(".live-tmp/**/gdunit_report.json", recursive=True) or glob.glob(
              ".live-tmp/**/command_report.json", recursive=True
          )
          if not hits:
              # The live self-test writes this JSON as it runs, so its absence means the step above
              # already failed before the CLI wrote it. Fail loud here too rather than a silent green
              # + empty upload — the property the old regenerate step held (its run was not
              # `|| true`-swallowed). Safe: this only fires when the required live-test step is
              # already red, so it never reds an otherwise-green job.
              print("::error::no corpus report under .live-tmp/ — the live self-test did not write one")
              sys.exit(1)
          data = json.load(open(hits[0], encoding="utf-8"))
          (file_obj,) = data["files"].values()  # the corpus target is a single file (pinned)
          data["files"] = {"corpus/turn_order.gd": file_obj}
          with open("report.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh)
          print(f"reused {hits[0]} -> report.json")
          PY

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-mutation-report
          path: report.json
          if-no-files-found: warn

  # --- Reporter shim: "Self-test (real Godot + GUT)" -------------------------------------------------
  # Peer of `selftest-godot` above — same shim shape, same history: this job's `name:` was the exact
  # branch-protection required-check name while this workflow ran automatically, removed alongside
  # it (ADR-0012). The real work is in the path-filtered `selftest-gut-run` below.
  selftest-gut:
    name: Self-test (real Godot + GUT)
    needs: [selftest-gut-run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report worker result
        env:
          RESULT: ${{ needs.selftest-gut-run.result }}
        run: |
          echo "selftest-gut-run result: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            exit 1
          fi

  # --- Live self-test: real Godot + GUT, end-to-end ----------------
  # The peer of selftest-godot-run for the GUT adapter (ADR-0011): installs the pinned GUT addon and
  # drives the shipped CLI (--runner gut) against real Godot on the same corpus, pinning the SAME
  # 18/11/7 per-mutant outcome as GdUnit4 — mutant-for-mutant agreement across the two frameworks is
  # the proof the runner seam is genuinely framework-agnostic. Same Godot pin/rationale as above.
  #
  # NOT a required check itself — path-filtered, gated behind `selftest-gut` above.
  selftest-gut-run:
    name: Self-test (real Godot + GUT) [worker]
    # Same as selftest-godot-run above: the path filter now lives in `secret-scan`.
    needs: secret-scan
    if: needs.secret-scan.outputs.godot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          cache: true

      - name: Godot smoke check
        run: godot --version

      - name: Install GUT addon (pinned commit + tree-hash verified)
        run: python scripts/install_gut.py

      # Run only the GUT leg of the live self-test (-k gut); the GdUnit4 leg auto-skips here (no
      # gdUnit4 addon installed), and running just the GUT test keeps this job focused, not a
      # duplicate of selftest-godot. On failure it prints the full per-mutant table + gdmutant's
      # stdout/stderr, so a red run is diagnosable from this log alone.
      - name: Live self-test (real Godot + GUT)
        run: GDMUTANT_GODOT=godot uv run pytest tests/test_selftest_live.py -k gut -v --no-cov
