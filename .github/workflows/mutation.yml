name: Mutation

# Mutation testing (dogfood) — gdmutant's own suite, run against mutmut.
#
# Split out of ci.yml so it can be PATH-SCOPED: this job is NOT a required status check on `main`
# (verify live with `gh api repos/kphutt/gdmutant/branches/main/protection` — required-check
# membership is a live branch-protection setting, not something this file or any script can
# guarantee by itself), so skipping it on changes that can't affect the mutation score (CI config,
# licenses, changelog) is a free, safe cost cut — it never gates a merge either way. It still runs
# on every push/PR that touches the source, tests, or anything the suite reads, exactly as before.
# This is a path filter on *which files changed*, NOT a shift to merge-time or a label gate.
#
# Two questions hide inside one job, and they don't need the same amount of work to answer.
# "Did I just break the suite" only needs the tests to run once (seconds). "What's the mutation
# score" needs every mutant re-run against them (~15-20 minutes, the whole point of the full
# `mutmut run`). mutmut has no incremental/diff-scoped mode (unlike Stryker's `--since`; see
# docs/decisions/0013), so that ~15-20 minutes buys the same whole-package number every time,
# regardless of how small the actual change is.
#
# On a pull_request, the full sweep NEVER runs, even when the diff touches `gdmutant/` or
# `tests/`: a PR gets pushed to repeatedly during review, and re-mutating the whole package on
# every one of those pushes pays that cost once per iteration for a number that mostly doesn't
# move. `poodle`'s local pre-commit hook is already the diff-scoped, fast, on-demand check for
# "did my change just break test coverage" (docs/mutation-testing.md); this job's `pytest`-only
# step is the same cheap safety net in the cloud, catching a doc file (or anything `also_copy` in
# pyproject.toml copies) breaking a test that reads it. Trigger `paths` stay broad for exactly
# that reason.
#
# On a push to `main` (i.e. once a PR actually lands), the full sweep runs IF the diff since the
# previous commit on `main` touches `gdmutant/**` (what mutmut mutates), `tests/**` (what kills a
# mutant), `corpus/**` (what the suite's own end-to-end tests read), `pyproject.toml`, or
# `uv.lock` — the only paths that can move the score at all. That keeps the standing package score
# (docs/mutation-testing.md's "Current result") current after every landed change, without paying
# for a sweep during the churn of getting there.
#
# Two outcomes look similar (mutmut exits non-zero, the step could fail) but mean very different
# things, and this workflow now reports them differently on purpose:
#   - Survivors exist, or the score is low: genuinely advisory. Nobody should be blocked on a
#     mutation score, so this can never fail the job — `mutmut run`'s own exit code is neutralized
#     inline (`|| true`) before either of the checks below runs.
#   - The baseline collection itself fails (the suite doesn't run cleanly unmutated — e.g. a file
#     the tests read that `also_copy` in pyproject.toml doesn't copy into mutmut's `mutants/` tree):
#     mutmut evaluates ZERO mutants. That's a real defect — the tool produced no signal at all — and
#     is detected explicitly below, independent of survivor count.
# The job intentionally has NO `continue-on-error: true` at the job level (it had one until
# 2026-07-30). That setting doesn't just make survivor-driven failures advisory — it makes *every*
# step failure in the job report a green run, including the baseline-failure `exit 1`s below that
# exist specifically to be loud. That combination let a real baseline failure (missing `poodle.toml`
# in `also_copy`) go unnoticed on `main` for hours: `gh run list` showed `success` because
# continue-on-error suppresses a failing job from ever turning the *run* red, and nobody reads
# individual job logs on a green run. Removing it doesn't add a required check (branch protection is
# unchanged) — it just lets a real baseline failure show up as a failed run the way any other broken
# CI job would, instead of hiding behind a workflow-level "everything's fine" checkmark.
on:
  pull_request:
    paths: &mutation-paths
      - "gdmutant/**" # the source mutmut mutates
      - "tests/**" # the suite that kills mutants
      - "corpus/**" # end-to-end tests read the corpus
      - "docs/**" # the guide-consistency test reads docs/
      - "AGENTS.md" # the link-resolution test reads it
      - "README.md" # the doc-sync guard test reads it
      - "CONTRIBUTING.md" # a test reads it (also_copy in pyproject.toml)
      - "CHANGELOG.md" # a test reads it (also_copy in pyproject.toml)
      - "CODE_OF_CONDUCT.md" # a test reads it (also_copy in pyproject.toml)
      - "CLAUDE.md" # a test reads it (also_copy in pyproject.toml)
      - "scripts/**" # verify_local.py, read by tests (also_copy in pyproject.toml)
      - ".pre-commit-config.yaml" # read by a test (also_copy in pyproject.toml)
      - "poodle.toml" # read by a test (also_copy in pyproject.toml)
      - "action.yml" # read by a test (also_copy in pyproject.toml)
      - ".github/**" # workflows and templates read by tests, plus this workflow itself
      - "pyproject.toml" # mutmut config + dependencies
      - "uv.lock" # locked dependencies
  push:
    branches: [main]
    paths: *mutation-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reports gdmutant's own mutation score on the run summary. NOT a required status check, so a
  # surviving mutant (or a low score) never blocks a merge — but a baseline that won't collect at
  # all now fails this job for real, on purpose. See docs/mutation-testing.md.
  mutation:
    name: Mutation testing (mutmut) — baseline must succeed, score is advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner
          fetch-depth: 0 # full history — the next step diffs against the base/previous commit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `uv run pytest` below exercises tests/test_htmlreport_behaviour.py, which drives the HTML
      # report's real inlined JS via a real `node` subprocess. Pinned for the same reason ci.yml's
      # own matching step is — see its comment.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Determine whether the mutation score can have moved
        id: scope
        # A pull_request never earns the full sweep (see the top-of-file comment): re-mutating the
        # whole package on every review push costs ~15-20 minutes per push for a number that mostly
        # doesn't move. Only a push to `main` — a change that already landed — can. When it can,
        # this still checks the actual diff against the narrower score-relevant list (not the
        # trigger's broad `paths:`), so a docs-only PR landing on main doesn't pay for a sweep
        # either. If the base commit is missing or unreachable (a force-push, a shallow history
        # gap, the branch's very first commit) this defaults to the full run — an unknown diff is
        # treated as "could have changed," never as "skip it," so a gap here fails loud (a slow run)
        # rather than silently (a score that never gets checked). GH_EVENT_NAME/GH_EVENT_BEFORE
        # come in via `env:` rather than `${{ }}` interpolated straight into the script, so the
        # values pass through the shell as plain data instead of expanded template text (zizmor's
        # template-injection check) — no such payload could actually be attacker-controlled here,
        # but the safe pattern costs nothing to use anyway.
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            echo "Pull request — the full sweep only runs once a change lands on main."
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="$GH_EVENT_BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable previous commit to diff against — running the full mutation sweep to be safe."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- gdmutant tests corpus pyproject.toml uv.lock | grep -q .; then
            echo "A score-relevant path changed — running the full mutation sweep."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under gdmutant/, tests/, corpus/, pyproject.toml, or uv.lock changed — the score can't have moved."
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests only (no score-relevant path changed)
        if: steps.scope.outputs.run_full == 'false'
        run: uv run pytest

      - name: Run mutmut (report mode)
        if: steps.scope.outputs.run_full == 'true'
        # Surviving mutants make `mutmut run` exit non-zero — expected here (documented equivalents),
        # so that alone must not fail the step. But a *baseline* failure (the suite doesn't run
        # cleanly unmutated) ALSO aborts mutmut with a non-zero exit, and a bare `|| true` would mask
        # it just the same as a real advisory-only run. Keep the run non-fatal here, but re-raise the
        # one baseline-failure signature grep can catch cheaply.
        run: |
          uv run mutmut run > mutmut-run.log 2>&1 || true
          cat mutmut-run.log
          # Verified against mutmut 3's own source (mutmut/__main__.py): a baseline that can't be
          # established prints one of several distinct messages depending on *how* it fails —
          # "failed to collect stats. runner returned ..." and "failed to collect stats, no active
          # tests found" both contain this substring, but "Stopping early, because we could not find
          # any test case..." and "Failed to run clean test" do not. This grep is a cheap, best-effort
          # catch for the two common ones and is NOT a complete signal by itself — the "Summarize"
          # step below is the authoritative, universal check (it looks at whether any mutant was
          # actually evaluated, which is false for every baseline-failure variant, regardless of
          # message wording) and is what actually re-raises here for real.
          if grep -qiF "failed to collect stats" mutmut-run.log; then
            echo "::error::mutmut baseline failed — could not collect stats (the suite does not run cleanly unmutated); any advisory score would be meaningless."
            exit 1
          fi

      - name: Summarize — score can't have moved
        if: always() && steps.scope.outputs.run_full == 'false'
        run: |
          {
            echo "## Mutation testing (mutmut) — skipped"
            echo
            echo "No changes under \`gdmutant/\`, \`tests/\`, \`corpus/\`, \`pyproject.toml\`, or"
            echo "\`uv.lock\` — the mutation score cannot have moved, so the full mutmut sweep was"
            echo "skipped. \`uv run pytest\` ran instead to confirm the suite still passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize the mutation score
        if: always() && steps.scope.outputs.run_full == 'true'
        run: |
          uv run mutmut export-cicd-stats || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          stats = pathlib.Path("mutants/mutmut-cicd-stats.json")
          d = json.loads(stats.read_text()) if stats.exists() else {}
          killed, survived = d.get("killed", 0), d.get("survived", 0)
          total = d.get("total", 0)
          # `total` is mutmut's OWN count of every mutant that got an exit code recorded at all —
          # calculate_summary_stats in mutmut/__main__.py sums every bucket into it: killed,
          # survived, no_tests, skipped, suspicious, timeout, segfault, and
          # check_was_interrupted_by_user. That makes `total == 0` the right predicate for "did
          # mutmut ever actually test a mutant" — not a hand-picked subset of buckets. An earlier
          # version of this check summed only killed + survived + timeout + suspicious ("evaluated"),
          # which is a strictly narrower set than `total` and was proven (in review, reproduced with a
          # synthetic stats file: killed=0, survived=0, total=5, no_tests=5) to false-positive whenever
          # every mutant lands in an excluded bucket like `no_tests` — a real, completed run with a
          # real (if score-less) result, wrongly reported as a failed baseline.
          # `stats.exists()` is False for every baseline-failure variant (export_cicd_stats requires
          # at least one source file with a non-empty exit_code_by_key before it writes anything, and
          # a failed baseline means no mutant ever reached that point — see mutmut/__main__.py's
          # export_cicd_stats/run_stats_collection), so `d = {}` and `total` defaults to 0 exactly
          # when no file was written. Conversely, whenever the file IS written, `total` is >= 1 by
          # construction (export_cicd_stats only includes files with at least one recorded exit
          # code), so `total == 0` cannot misfire on a real, completed run regardless of which
          # buckets its mutants landed in. This job has no `continue-on-error`, so this exit really
          # fails the job (and the run) — that's the point; see the top-of-file comment.
          if total == 0:
              print("## Mutation testing (mutmut) — BASELINE FAILED")
              print()
              print("mutmut evaluated **0 mutants** — the suite does not run cleanly unmutated, so "
                    "no score exists. This job fails for real here, on purpose: a baseline failure "
                    "means the tool produced no signal at all, which is not something to average "
                    "away as an advisory score.")
              sys.exit(1)
          scored = killed + survived
          score = f"{100 * killed / scored:.1f}%" if scored else "n/a"
          print("## Mutation testing (mutmut) — advisory")
          print()
          print(f"- **Score:** {score}  ({killed} killed / {scored} killable)")
          print(f"- **Survivors:** {survived} — documented equivalents in `docs/mutation-testing.md`")
          PY
