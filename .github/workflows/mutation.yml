name: Mutation

# Advisory mutation testing (dogfood) — gdmutant's own suite, run against mutmut.
#
# Split out of ci.yml so it can be PATH-SCOPED: this is advisory (continue-on-error) and NOT a
# required status check, so skipping it on changes that can't affect the mutation score (CI config,
# licenses, changelog) is a free, safe cost cut — it never gates a merge. It still runs on every
# push/PR that touches the source, tests, or anything the suite reads, exactly as before. This is
# a path filter on *which files changed*, NOT a shift to merge-time or a label gate.
on:
  pull_request:
    paths: &mutation-paths
      - "gdmutant/**" # the source mutmut mutates
      - "tests/**" # the suite that kills mutants
      - "corpus/**" # end-to-end tests read the corpus
      - "docs/**" # the guide-consistency test reads docs/
      - "AGENTS.md" # the link-resolution test reads it
      - "README.md" # the doc-sync guard test reads it
      - "pyproject.toml" # mutmut config + dependencies
      - "uv.lock" # locked dependencies
      - ".github/workflows/mutation.yml" # this workflow itself
  push:
    branches: [main]
    paths: *mutation-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reports gdmutant's own mutation score on the run summary. continue-on-error + NOT a required
  # status check, so a surviving mutant never fails CI. See docs/mutation-testing.md.
  mutation:
    name: Mutation testing (mutmut, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store — skips re-downloading the locked deps each job

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Run mutmut (report mode)
        # Surviving mutants make `mutmut run` exit non-zero — expected here (documented equivalents),
        # so that alone must not fail the step. But a *baseline* failure (the suite doesn't run
        # cleanly unmutated) ALSO aborts mutmut, and a bare `|| true` would mask it as a green
        # advisory run. Keep the run non-fatal, but re-raise the baseline signature.
        run: |
          uv run mutmut run > mutmut-run.log 2>&1 || true
          cat mutmut-run.log
          # mutmut 3 prints "failed to collect stats" (two variants) and exits 1 when the baseline
          # can't be established — the exact signature the `|| true` above would otherwise swallow.
          if grep -qiF "failed to collect stats" mutmut-run.log; then
            echo "::error::mutmut baseline failed — could not collect stats (the suite does not run cleanly unmutated); any advisory score would be meaningless."
            exit 1
          fi

      - name: Summarize the mutation score
        if: always()
        run: |
          uv run mutmut export-cicd-stats || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          stats = pathlib.Path("mutants/mutmut-cicd-stats.json")
          d = json.loads(stats.read_text()) if stats.exists() else {}
          killed, survived = d.get("killed", 0), d.get("survived", 0)
          evaluated = killed + survived + d.get("timeout", 0) + d.get("suspicious", 0)
          # A baseline failure (or a missing/empty stats file) means mutmut evaluated ZERO mutants —
          # indistinguishable from "all killed" unless we check. Fail loudly instead of masking it
          # as a green advisory run; a real run always evaluates >0 mutants.
          if evaluated == 0:
              print("## Mutation testing (mutmut) — BASELINE FAILED ⚠️")
              print()
              print("mutmut evaluated **0 mutants** — the suite does not run cleanly unmutated, so "
                    "no score exists. This advisory job is red on purpose.")
              sys.exit(1)
          scored = killed + survived
          score = f"{100 * killed / scored:.1f}%" if scored else "n/a"
          print("## Mutation testing (mutmut) — advisory")
          print()
          print(f"- **Score:** {score}  ({killed} killed / {scored} killable)")
          print(f"- **Survivors:** {survived} — documented equivalents in `docs/mutation-testing.md`")
          PY
