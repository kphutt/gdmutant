name: Release

# Tag-triggered release. Pushing a version tag (vX.Y.Z) creates a DRAFT GitHub Release with
# auto-generated notes. publish.yml listens for `release: published`, which a draft does not fire —
# so pushing the tag only stages the release; a maintainer must open it on GitHub and click Publish
# before publish.yml -> PyPI runs. That's the human, auditable act ADR-0010 calls for: the tag alone
# gets everything reviewed and staged, but a real PyPI upload still needs a second, deliberate click.
#
# This workflow deliberately adds NO second publish path. It only creates the (draft) Release that
# publish.yml already listens for — the OIDC/Trusted-Publishing flow stays exactly where it is.
#
# It also never creates or moves a tag. `gh release create --verify-tag` fails if the tag does not
# already exist, so the workflow can only ever react to a tag the maintainer pushed — which is what
# keeps it compatible with the tag-protection ruleset that blocks deletion and re-pointing.
#
# CI GATE — this workflow will not create a Release (draft or otherwise) for a commit whose CI did
# not pass.
#
# THIS GATE IS NOT THE AUTHORITATIVE ONE. `release: published` -- the event that actually fires a
# PyPI upload in publish.yml -- is reachable WITHOUT this workflow running at all: a maintainer can
# create and publish a Release straight from the GitHub web UI. The authoritative copy of this same
# check lives in publish.yml's own `ci-gate` job, immediately before the OIDC credential is minted.
# This one exists to fail early and cheap, on the tag push, before a draft Release is even staged --
# see publish.yml's header comment for the full reasoning on why both are needed.
#
# THE HOLE THIS CLOSES. Until now this workflow gated only on commit-ANCESTRY ("is the tagged commit
# reachable from main?"), and publish.yml (`release: published` -> PyPI) had no dependency on ci.yml's
# conclusion for the tagged commit at all. That was masked only while `Verify (windows-2025)` was a
# required check: a commit could not reach `main` unless Windows CI passed on it, so every ancestor of
# `main` had implicitly passed CI. #126 moved Windows CI to a local, pre-release step (cost — Windows
# runners bill 2x) and dropped it from required checks, so that implicit guarantee is gone: a
# Windows-only regression (or any CI failure on a commit force-merged past a red check, or a commit
# whose CI run was cancelled/never completed) can now reach `main` and be tagged with nothing
# mechanical objecting.
#
# THE MECHANISM: a `ci-gate` job that queries the Actions API for ci.yml's most recent `push`-
# triggered run AT THE EXACT TAGGED COMMIT and fails closed unless that run concluded `success`.
# `workflow_run` (lodestar's deploy.yml pattern) does NOT fit here: it triggers a workflow when
# ANOTHER workflow finishes, but this workflow is triggered by a tag push / (indirectly) a Release
# publish — a different event class entirely, and there is no `ci.yml`-finishes-and-a-tag-exists
# event to hook. Polling the API is the only mechanism available for a tag-triggered gate, and the
# cost objection that rules out polling in lodestar (a runner idling while CI finishes) does not apply
# here: by the time a maintainer tags a commit, that commit's CI (a `push`-to-main run) either already
# finished minutes/days ago or never will — there is nothing to wait for, only a status to look up.
#
# WHICH COMMIT'S CI, AND HOW THAT'S GUARANTEED: the run looked up is ci.yml's `push` run for the exact
# commit `git rev-parse HEAD` resolves to after checking out the tag (see "Resolve the tagged commit"
# below) — never `main`'s current tip, and never `github.sha`, which the ancestry check's own comment
# already flags as ambiguous for annotated tags. `main` is squash-merge-only (branch protection), so
# every commit that ever became `main`'s tip produced exactly one `push`-triggered ci.yml run at that
# SHA; `event=push` in the query additionally rules out a `pull_request` run (e.g. a fork PR whose
# head shares this content) satisfying the gate, mirroring lodestar deploy.yml's `event == 'push'`
# check and the same rationale.
#
# FAIL CLOSED. An API error, zero matching runs, a run still `in_progress`/`queued`, or a `cancelled`/
# `failure`/`timed_out` conclusion all `exit 1` from the same script — there is no code path that
# defaults to permitting a release. Only an explicit, completed `success` lets `release` (which
# `needs: ci-gate`) proceed; GitHub Actions' default `needs:` behavior skips a dependent job whose
# dependency failed, so there is no separate `if:` to get wrong.
on:
  push:
    tags: ["v*.*.*"]

# Least privilege at the workflow level; each job below opts into only the elevation it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  # ── THE GATE ──────────────────────────────────────────────────────────────────────────────────
  # Decides ONE thing: whether ci.yml concluded `success` for the exact commit this tag points at.
  # It never authenticates to PyPI and never creates a Release — the worst a bug here can do is
  # refuse to release. Kept as its own job (not a step in `release` below) so the privilege it
  # needs (`actions: read`, to query the Actions API) never sits in the same job as `release`'s
  # `contents: write` (creating the draft Release).
  ci-gate:
    name: Gate — CI passed for the tagged commit
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 5
    permissions:
      contents: read # checkout only, to resolve the tagged commit
      actions: read # query the Actions API for ci.yml's conclusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # only HEAD is needed to resolve the tagged commit's SHA
          persist-credentials: false # this job only reads; it never pushes

      # Same trap the ancestry check below already documents: `github.sha` / `github.ref_name` are
      # ambiguous for an ANNOTATED tag (the ref can resolve to the tag object, not the commit it
      # points to). actions/checkout resolves the ref correctly; `git rev-parse HEAD` after checkout
      # is the one source of truth for "which commit does this tag mean" used anywhere in this file.
      - name: Resolve the tagged commit
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Tagged commit: $sha"

      # Fail-closed lookup: query ci.yml's `push`-triggered runs for this exact SHA and require the
      # most recent one to be a completed `success`. See the workflow-level comment above for why
      # this is the mechanism (not workflow_run) and why it is safe not to poll/wait.
      #
      # THE SAME SCRIPT RUNS AGAIN IN publish.yml, IMMEDIATELY BEFORE THE UPLOAD. This call is the
      # early, cheap one: it stops a bad tag from ever producing a draft Release. It is NOT the
      # authoritative one, because this workflow is not the only way to reach PyPI -- a maintainer
      # can create and publish a Release straight from the GitHub UI, which fires publish.yml
      # without this file running at all. Shared as a script (not an inline block in each) so the
      # two calls cannot drift apart; unit-tested in tests/test_require_ci_success.py.
      # Values reach the script through `env:`, never string-interpolated into the shell command --
      # a `${{ }}` expansion inside `run:` is the classic Actions template-injection shape.
      - name: Verify CI passed for this exact commit (fail closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: python3 scripts/require_ci_success.py --repo "$REPO" --sha "$SHA"

      - name: Summarize the gate decision
        if: always()
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Release CI gate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tagged commit | \`${SHA:-unresolved}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: ci-gate # fail closed: a failed/skipped gate skips this job too — no separate `if:` needed
    name: Create GitHub Release
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    permissions:
      contents: write # the only elevation: creating a Release is a write to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the "is this commit on main?" guard below walks back to the merge base,
          # and a shallow clone has no main history for git to walk.
          fetch-depth: 0
          persist-credentials: false # the release is created via gh + GITHUB_TOKEN, not git creds

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Guard BEFORE the Release exists. Creating it fires publish.yml, which uploads to PyPI —
      # and a PyPI version number can never be reused. A tag that disagrees with the packaged
      # version must fail here, while failing is still free.
      - name: Verify the tag matches the packaged version
        run: python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # The second guard, also BEFORE the Release exists, and irreversible for the same reason.
      # The two answer different questions: the step above asks "is this the right version number?",
      # this one asks "is this the right commit?".
      #
      # Tag protection stops a tag being deleted or re-pointed, but nothing stops a version tag from
      # being *created* at an arbitrary commit — including one on a branch that never passed Verify
      # or the self-tests. Branch protection on main cannot see a tag push at all. So without this
      # step, the only thing between an unreviewed commit and PyPI is its pyproject.toml version
      # string happening to match the tag. This is what ties a release to reviewed history.
      - name: Verify the tagged commit is on main
        # HEAD is the tagged commit actions/checkout checked out, so this sidesteps the annotated-
        # vs-lightweight tag ambiguity in github.sha. main is resolved from the remote by explicit
        # refspec: the check must not depend on a local main branch happening to exist here, and the
        # refspec guarantees refs/remotes/origin/main is written however the clone is configured.
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            # ASCII only, for the same reason as the version guard's message: gdmutant already
            # shipped a Windows bug where console output crashed under the legacy cp1252 code page,
            # and a guard that crashes instead of reporting the problem is worse than no guard.
            echo "::error::tag $GITHUB_REF_NAME points at $commit, which is not an ancestor of origin/main. Refusing to publish a commit that is not on main."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main ($commit)"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # `gh` ships on the runner, so this needs no third-party action and adds no supply-chain
      # surface. --verify-tag: fail if the tag is missing rather than creating one. --draft: stage
      # the release without firing `release: published` (see docs/decisions/0010), so publish.yml
      # -> PyPI waits for a maintainer to open it on GitHub and click Publish.
      - name: Create the Release with generated notes (as a draft)
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
