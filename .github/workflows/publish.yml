name: Publish

# Publish gdmutant's distributions to a package index using PyPI Trusted Publishing
# (OIDC) — NO long-lived API token is stored in the repo. The index mints a short-lived
# credential for this exact repo+workflow+environment at publish time. See
# docs/decisions/0010-pypi-trusted-publishing.md for the design and the one-time manual
# seed the maintainer must do on pypi.org / test.pypi.org before either path can succeed.
#
# Two paths:
#   - workflow_dispatch  -> build + secret scan + publish to TestPyPI  (the deliberate dry-run)
#   - release: published -> build + gate + publish to PyPI  (a real release)
#
# The build runs in its own job with NO elevated permissions; only the publish jobs get
# `id-token: write`, and each is gated behind a protection-capable GitHub Environment
# (`testpypi` / `pypi`). This keeps the OIDC-token job doing nothing but download+upload.
#
# THE DRY-RUN PATH IS NOT UNGUARDED. TestPyPI is a PUBLIC index and the upload happens under this
# project's own trusted-publishing identity, so "it is only the throwaway index" is not a reason to
# let an unreviewed, unscanned ref reach it. `workflow_dispatch` can be fired against any ref the
# repository has, so `publish-testpypi` carries the one guard that is meaningful without a tag:
# `secret-scan`, which runs on BOTH events and scans whichever commit is being built. The
# tag-shaped guards cannot apply here and are not silently skipped by accident: `provenance`'s two
# checks and `readme-images` need a tag that a rehearsal deliberately does not have. The `verify`
# suite is deliberately not repeated either -- the dry-run exists to rehearse the OIDC upload path,
# not to re-run CI, which `ci.yml` already ran on the pull request. The other half of this posture
# is a deployment branch policy on the `testpypi` GitHub Environment, which is repository
# configuration rather than workflow text; docs/releasing.md's one-time seed section carries it,
# next to the `pypi` environment's own policy.
#
# THIS FILE HOLDS THE AUTHORITATIVE RELEASE GATE (ADR-0012) — see `provenance` and the five
# verification jobs below it. It is authoritative because `release: published` is reachable
# WITHOUT release.yml: a maintainer can create and publish a GitHub Release straight from the web
# UI, and this workflow runs while release.yml never does. release.yml runs the two provenance
# guards again, earlier, on the tag push, where failing is still free — but a gate that lived only
# there would guard the convenient path and leave the irreversible one open.
#
# WHY THIS RUNS THE FULL VERIFY SUITE LIVE, NOT A LOOKUP. `ci.yml` used to run automatically on
# every push and PR; publish.yml's gate just asked the Actions API "did that pass for this exact
# commit?" ADR-0012 turned `ci.yml`'s auto-triggers off (private-repo Actions cost — every push
# billed five jobs' worth of 1-minute-minimums, and it doesn't gate anything that ships: merging
# isn't publishing here, only a tag + a human "Publish" click is). Once `ci.yml` stops running
# automatically, an API lookup for its history finds nothing and this gate would fail closed on
# every release forever — not just the risky ones. So the gate below doesn't look anything up: it
# RUNS `ci.yml`'s jobs itself, live, on the exact commit being published, right here. Each job
# below reuses `ci.yml`'s own steps (via `scripts/verify_local.py --job <name>`, which reads them
# out of `ci.yml` rather than restating them — same mechanism `verify_local.py` already used for
# the Windows leg) or, for the Godot self-tests, the existing manual-hook scripts. One definition
# of what each check does either way; only WHERE and WHEN it executes changed.
#
# This also closes a gap `ci.yml`'s own comments already admitted: Windows `verify` coverage was
# "a discipline, not a gate — nothing enforces that mechanically." It's mechanical now, for every
# real release, on both Linux and Windows.
#
# SECRET SCAN, ADDED HERE (was missing entirely on this path). `ci.yml`'s `secret-scan` job is
# dormant along with everything else on that trigger, and the local pre-commit hook
# (scripts/run_gitleaks.py) is commit-stage only, scans only the staged diff, is skippable with
# `--no-verify`, and SILENTLY exits 0 if the `gitleaks` binary isn't on PATH — found while fixing
# this: there was no point on the actual release path, cloud or local, where a leaked secret was
# guaranteed to be caught. `secret-scan` below scans full history (`fetch-depth: 0`) reachable from
# the released commit — the question that matters right before code goes public and a package
# ships from it. It runs the gitleaks CLI directly rather than through `gitleaks/gitleaks-action` —
# that wrapper action hard-refuses `release` events entirely, so this job can't use it; see its own
# step comments for the full story. `ci.yml`'s secret-scan job runs the same direct-CLI approach,
# pinned to the same v8.30.1, so the two paths can't quietly diverge again.
#
# Eight guards, all fail-closed, all before `publish-pypi` gets `id-token: write`. Guard 3 is the
# only one that also gates the TestPyPI dry-run; the rest need a tag, which a rehearsal has not got:
#   1. the tag matches the version in pyproject.toml      (scripts/check_release_tag.py)
#   2. the released commit is an ancestor of main          (git merge-base --is-ancestor)
#   3. no secret in history reachable from this commit     (gitleaks CLI direct, full history)
#   4. verify passes on Linux                              (scripts/verify_local.py --job verify)
#   5. verify passes on Windows                             (same script, windows-2025 runner)
#   6. license compliance                     (scripts/verify_local.py --job license-check)
#   7. both Godot self-tests, real Godot        (scripts/run_selftest.py / run_selftest_gut.py)
#   8. every image in the BUILT long description resolves  (scripts/check_readme_images.py)
#
# ...and one check AFTER the upload, which is not a guard and does not pretend to be:
#   `verify-published` installs the released version from PyPI into a clean environment and runs
#   it. Nothing it finds can un-publish a version number, so it cannot gate anything; what it
#   replaces is a maintainer remembering to try the package by hand after every release.
on:
  workflow_dispatch: # deliberate TestPyPI dry-run, fired by hand
  release:
    types: [published] # a published GitHub Release -> real PyPI

# Least privilege at the workflow level; only the publish jobs opt into id-token below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

jobs:
  # --- Build once: sdist + wheel, metadata-validated -------------------------
  # Runs with only the workflow-level `contents: read` — no OIDC here, so the build
  # backend's code never executes in a job that can mint a publishing credential.
  #
  # IT BUILDS PROVENANCE'S COMMIT, NOT WHATEVER THE DEFAULT REF RESOLVES TO. `provenance` exists to
  # authoritatively resolve the released commit, and every verification job below checks out its
  # answer. The artifact that actually gets UPLOADED has to come from that same commit, or the gate
  # verifies one commit while the package ships another. This job used to have neither `needs:` nor
  # a `ref:`, so the match rested on an implicit default (a `release` event's default ref happens to
  # be `refs/tags/<tag>`) plus the tag ruleset that stops a tag being re-pointed. Both hold today,
  # and neither was checked here. The job built to answer "which commit?" simply was not in the path
  # of the job that produces the thing being uploaded. Now it is.
  build:
    name: Build distributions
    # `provenance` is `release`-only, so on the workflow_dispatch dry-run it is skipped — and a
    # skipped `needs:` skips this job too unless the `if:` overrides that default. `!cancelled()`
    # rather than `always()`: it restores the job the same way without also resurrecting it on a
    # cancelled run. The second clause keeps the release path fail-closed — no provenance success,
    # no build — so this dependency can never soften the gate it was added to tighten.
    needs: [provenance]
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.provenance.result == 'success')
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a release: the exact commit `provenance` resolved. On the dry-run: the dispatched
          # ref, because there is no provenance job and no tag to resolve.
          ref: ${{ github.event_name == 'release' && needs.provenance.outputs.sha || github.ref }}
          persist-credentials: false # this job never uses git creds — don't leave them on the runner

      # The `ref:` above is an expression, and an expression that evaluates to an empty string does
      # not fail — `actions/checkout` falls back to the default ref and the run stays green. That is
      # the "gate that passes without checking anything" shape, so this says out loud which commit
      # was built and refuses on a release if it is not the one provenance attested.
      - name: Confirm the build is on provenance's commit
        if: github.event_name == 'release'
        env:
          EXPECTED_SHA: ${{ needs.provenance.outputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            # ASCII only, for the same reason guard 2 is: a guard that crashes on an encoding
            # instead of reporting the problem is worse than no guard.
            echo "::error::build checked out $actual but provenance attested '${EXPECTED_SHA}'. Refusing to build an artifact the release gate is not verifying."
            exit 1
          fi
          echo "building provenance's commit: $actual"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true # cache uv's global store

      - name: Build sdist + wheel
        run: uv build # writes dist/*.tar.gz + dist/*.whl

      - name: Validate distribution metadata (twine check)
        run: uv run --with twine twine check dist/*

      - name: Upload dist as an artifact for the publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --- Dry-run path: TestPyPI via workflow_dispatch --------------------------
  # `secret-scan` is a hard dependency, exactly like every guard in `publish-pypi`'s `needs:` — a
  # red scan skips this job, and no `if: always()` exists to wave it through. It is here because
  # this path uploads to a public index under the project's own trusted-publishing identity and can
  # be fired against any ref: without it, a branch carrying a leaked credential could be packaged
  # and published publicly with nothing having looked. See the header for why the tag-shaped guards
  # are not (and cannot be) on this path.
  publish-testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: [build, secret-scan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gdmutant
    permissions:
      contents: read
      id-token: write # OIDC: mint the short-lived TestPyPI credential — the ONLY job that needs it
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # --- Provenance: the right version, the right commit ------------------------
  # WHICH COMMIT: the release's tag, resolved to a commit by actions/checkout + `git rev-parse HEAD`.
  # Not `github.sha`, which is ambiguous for an ANNOTATED tag (the ref can resolve to the tag object
  # rather than the commit it points at), and not `target_commitish`, which is often just the branch
  # name "main" and would check main's CURRENT tip instead of the commit being released.
  #
  # This job holds NO publishing privilege and no elevated Actions API access — the worst a bug in
  # it can do is refuse to publish. Its `sha` output feeds every verification job below, so they
  # all check out and verify the SAME commit this job resolved, not whatever `main` happens to be
  # by the time they run.
  provenance:
    name: Gate - the right version, the right commit
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04 # pinned (not ubuntu-latest) so a runner-image migration can't silently break us
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The RELEASED tag, not the default ref. Without this the job would happily verify main's
          # tip and report success for a commit that is not the one being published.
          ref: ${{ github.event.release.tag_name }}
          # Full history: the ancestry guard walks back to the merge base with main, and a shallow
          # clone has no main history for git to walk.
          fetch-depth: 0
          persist-credentials: false # this job only reads; it never pushes

      - name: Resolve the released commit
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Released commit: $sha"

      # Guard 1 - the right VERSION NUMBER. A tag of v0.2.0 against a pyproject.toml still saying
      # 0.1.0 would upload 0.1.0 under a release labelled 0.2.0, and the only remedy is yanking and
      # burning a version number.
      - name: Verify the tag matches the packaged version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: python3 scripts/check_release_tag.py "$TAG_NAME"

      # Guard 2 - the right COMMIT. Tag protection stops a tag being deleted or re-pointed for
      # anyone acting normally (see docs/releasing.md for the admin-override exception), but
      # nothing stops a version tag from being CREATED at an arbitrary commit, and branch protection
      # on main cannot see a tag push at all. This is what ties a release to reviewed history.
      #
      # persist-credentials: false (above) strips this checkout's git credentials, so a bare
      # `git fetch origin` fails authenticating against a private repo -- the same bug release.yml's
      # twin guard hit on a real tag push (see that file's comment for the full story). Fixed the
      # same way: an auth header scoped to exactly the github.com URL, which a local-path remote (as
      # used by this guard's own tests) ignores entirely.
      - name: Verify the released commit is on main
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            # ASCII only: gdmutant already shipped a Windows bug where console output crashed under
            # the legacy cp1252 code page, and a guard that crashes instead of reporting the problem
            # is worse than no guard.
            echo "::error::tag $TAG_NAME points at $commit, which is not an ancestor of origin/main. Refusing to publish a commit that is not on main."
            exit 1
          fi
          echo "tag $TAG_NAME is on main ($commit)"

      - name: Summarize the gate decision
        if: always()
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "### PyPI publish gate"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Released commit | \`${SHA:-unresolved}\` |"
            echo "| Tag | \`${TAG_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Guard 3: no secret anywhere in history reachable from this commit --------
  # ADDED because this repo's release path had no secret scan at all before this: ci.yml's
  # secret-scan job is dormant with everything else on that trigger, and the local pre-commit
  # hook (scripts/run_gitleaks.py) is commit-stage only, staged-diff only, skippable with
  # `--no-verify`, and silently exits 0 if `gitleaks` isn't on PATH. Full history
  # (`fetch-depth: 0`), scanning the exact commit being released, not just its own diff. Runs the
  # gitleaks CLI directly (see the step below) -- the `gitleaks/gitleaks-action` wrapper doesn't
  # support `release` events at all.
  #
  # IT GUARDS BOTH PATHS. This is the one guard that does not need a tag to mean something, so it
  # runs on the workflow_dispatch dry-run too and sits in `publish-testpypi`'s `needs:` — that path
  # can be fired against any ref and uploads to a public index under this project's own identity.
  # Same `!cancelled()` shape as `build` above, for the same reason and with the same fail-closed
  # second clause: on a release, no provenance success means no scan and therefore no publish.
  secret-scan:
    name: Secret scan (gitleaks, full history)
    needs: [provenance]
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.provenance.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released commit on a release; the dispatched ref on a dry-run, which is the commit
          # `build` packaged and `publish-testpypi` is about to upload.
          ref: ${{ github.event_name == 'release' && needs.provenance.outputs.sha || github.ref }}
          fetch-depth: 0 # full history — the question here is "ever leaked", not "leaked in this diff"
          persist-credentials: false

      # Same asymmetry `build` (above, in this same file) guards against with its own "Confirm the
      # build is on provenance's commit" step: the `ref:` expression above evaluates to an empty
      # string on a bug, `actions/checkout` falls back to the default ref instead of failing, and
      # the run stays green having silently scanned the wrong commit. Traced whether that is
      # actually reachable and it is not today (`provenance`'s own `resolve` step either prints a
      # real sha or exits non-zero, which already fails `needs.provenance.result == 'success'` and
      # skips this job via the `if:` above) -- but `build`'s check makes the same non-exploitability
      # argument for itself, not for this job, so this stays honest on its own rather than relying
      # on a sibling job's check to transitively cover it.
      - name: Confirm the scan is on provenance's commit
        if: github.event_name == 'release'
        env:
          EXPECTED_SHA: ${{ needs.provenance.outputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::secret-scan checked out $actual but provenance attested '${EXPECTED_SHA}'. Refusing to trust a scan of a commit the release gate did not verify."
            exit 1
          fi

      # gitleaks/gitleaks-action (the wrapper this job used to reach for, and that ci.yml's
      # secret-scan job used until this same fast-follow) hardcodes its own supported-event list
      # (its src/index.js, checked directly at SHA e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e / v3.0.0):
      # push, pull_request, workflow_dispatch, schedule -- `release` is not in it, and the action
      # hard-exits with "The [release] event is not yet supported" if asked to run under one. This
      # first surfaced on the real v0.1.0 release.
      #
      # First attempt at a fix overrode GITHUB_EVENT_NAME to workflow_dispatch for this step,
      # reasoning that workflow_dispatch/schedule both route to an untargeted full scan (no
      # baseRef/headRef) -- exactly what this job wants. That reasoning about the action's own code
      # was correct (independently verified), but the override itself does nothing: GitHub reserves
      # GITHUB_* variables and silently ignores any attempt to set them via a step's `env:` -- the
      # override appeared in the step's own env log and the action still failed identically. Real
      # v0.1.0 release run confirmed this the hard way.
      #
      # Real fix: bypass the wrapper action entirely and run gitleaks directly, with the identical
      # command the wrapper uses for a full scan (read from gitleaks-action's own gitleaks.js
      # Scan() function at the SHA named above -- the workflow_dispatch/schedule branch has no
      # --log-opts, so this is it verbatim). Binary pinned + checksummed against gitleaks' own
      # published release, same discipline as this repo's SHA-pinned actions. `ci.yml`'s secret-scan
      # job now installs this exact same pinned version the same way, so the two no longer diverge.
      - name: Install gitleaks
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks (full history)
        run: ./gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug

      # gitleaks-action uploads this by default regardless of outcome, so a real hit has a
      # structured, downloadable report to work from, not just the console log. Matches that here.
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore

  # --- Guards 4-5: the whole `verify` job, live, on both OSes -----------------
  # Reuses ci.yml's `verify` job steps via scripts/verify_local.py (reads them out of ci.yml rather
  # than restating them — one definition, so this and ci.yml cannot drift). This is also what closes
  # the Windows gap ci.yml's own comments already flagged: local-only Windows verify was "a
  # discipline, not a gate." It's a real gate now, once a year or two, at release time — not on
  # every push, which is what made it too expensive to run there.
  verify-ubuntu:
    name: Verify (ubuntu-24.04, release-time)
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }} # the exact commit provenance resolved, not main's tip
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned for the same reason ci.yml's own matching step is — see its comment.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Run ci.yml's verify job
        run: uv run python scripts/verify_local.py

  verify-windows:
    name: Verify (windows-2025, release-time)
    needs: provenance
    if: github.event_name == 'release'
    runs-on: windows-2025 # pinned (not -latest) — same reasoning as every other runner in this repo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned for the same reason ci.yml's own matching step is — see its comment.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Run ci.yml's verify job
        run: uv run python scripts/verify_local.py

  # --- Guard 5: license compliance, live ---------------------------------------
  license-check:
    name: License compliance (release-time)
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      # Unlike the local pre-commit hook (scripts/license_check_local.py), no isolated venv is
      # needed — this runner is thrown away, not a shared dev machine, so `uv sync --no-dev`
      # stripping dev deps out of it is fine, not a self-locking conflict.
      - name: Run ci.yml's license-check job
        run: uv run python scripts/verify_local.py --job license-check

  # --- Guard 6: both Godot self-tests, live -------------------------------------
  # Mirrors ci.yml's selftest-godot-run / selftest-gut-run steps, minus the path filter (release
  # time always runs the full suite — there is no "docs-only tag" worth optimizing for) and minus
  # the report-upload artifact (nothing downstream reads it here; pass/fail is all that matters).
  selftest-godot:
    name: Self-test (real Godot, release-time)
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.0
          use-dotnet: false
          cache: true

      - name: Godot smoke check
        run: godot --version

      - name: Live self-test (real Godot)
        run: python scripts/run_selftest.py

  selftest-gut:
    name: Self-test (real Godot + GUT, release-time)
    needs: provenance
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install deps (frozen lockfile)
        run: uv sync --frozen

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.0
          use-dotnet: false
          cache: true

      - name: Godot smoke check
        run: godot --version

      - name: Live self-test (real Godot + GUT)
        run: python scripts/run_selftest_gut.py

  # --- Guard 8: every image in the long description actually resolves -----------
  # THE DEFECT THIS EXISTS FOR. README.md is the PyPI long description, and PyPI does not resolve a
  # repo-relative image path the way GitHub does -- it hands the literal string to a camo proxy,
  # which hex-encodes it and 404s. So a banner that is perfect on the repo front page can be a
  # broken image on the project page, and a long description is FROZEN AT UPLOAD: there is no
  # edit-after, only a new version number. `twine check` (in `build` above) cannot see this at all;
  # it validates that the metadata parses and renders, never that a URL resolves.
  #
  # IT READS THE BUILT ARTIFACT, NOT README.md. Those differ on purpose -- pyproject.toml's
  # hatch-fancy-pypi-readme hook rewrites the banner's relative src into an absolute, tag-pinned
  # raw.githubusercontent.com URL at build time. Checking the file on disk would check a string no
  # user ever sees, so this downloads the same `dist` artifact `publish-pypi` will upload and reads
  # the long description straight out of its metadata.
  #
  # WHY HERE AND NOWHERE EARLIER. The rewritten URL contains the release tag (`.../v0.1.0/...`), so
  # it cannot resolve until that tag exists on GitHub. Anywhere before the tag -- a PR check, the
  # `build` job, release.yml's tag-push guards -- it would fail on a URL that is not wrong, only
  # early, and a gate that always fails gets deleted. `needs: [build, provenance]` puts it after
  # the artifact exists and after provenance has proved the tag names this commit, and it sits in
  # `publish-pypi`'s `needs:` so it runs before the OIDC token is minted. That is the last moment
  # where failing is still free.
  #
  # The workflow_dispatch TestPyPI rehearsal deliberately skips this: it builds from an untagged
  # commit, so the pinned URL 404s by design there (pyproject.toml says as much). `if:` excludes it
  # rather than letting a known-false failure train anyone to ignore a red X.
  #
  # tests/test_packaging.py already catches the static half of this offline (a relative path
  # surviving the substitution). This catches the half a static test cannot: absolute, well-formed,
  # and still not there.
  readme-images:
    name: Gate - every image in the PyPI long description resolves
    needs: [build, provenance]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # reads an artifact and makes outbound GETs; it has nothing to write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }} # the released commit's copy of the check
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The exact artifact publish-pypi will upload -- not a rebuild, which could differ.
      - name: Download the built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Stdlib only (urllib) -- no `uv sync`, no third-party HTTP client, nothing to resolve.
      # Exit 1 means an image is genuinely broken; exit 3 means the network could not answer, and
      # the script says which, so nobody re-cuts a version over a bad minute at a badge host.
      - name: Check every image in the built long description
        run: python3 scripts/check_readme_images.py --dist-dir dist

  # --- Release path: PyPI via a published GitHub Release ---------------------
  publish-pypi:
    name: Publish to PyPI
    # Every guard is a hard dependency: GitHub skips a job whose `needs:` failed OR was skipped, and
    # there is no `if: always()` here to override that -- so a failed guard cannot be bypassed. On
    # workflow_dispatch (the TestPyPI dry-run) all of these skip, and this job's own `if:` already
    # excludes it, so the skip changes nothing on that path.
    needs:
      [
        build,
        provenance,
        secret-scan,
        verify-ubuntu,
        verify-windows,
        license-check,
        selftest-godot,
        selftest-gut,
        readme-images,
      ]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/gdmutant
    permissions:
      contents: read
      id-token: write # OIDC: mint the short-lived PyPI credential — the ONLY job that needs it
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # --- After the upload: prove the published package installs and runs ----------
  # NOT A GATE, AND IT MUST NOT BE MISTAKEN FOR ONE. It runs after `publish-pypi`, so by the time
  # it can answer anything the version number is already spent and unreusable. Putting it in
  # `publish-pypi`'s `needs:` would deadlock the workflow, and no ordering exists that would let it
  # prevent a bad upload -- the only way to check what the index serves is to publish first.
  #
  # What it replaces is a person. The release runbook's post-release step was "install it and try
  # it", which is exactly the kind of step that gets skipped on the day it would have mattered.
  # Now the release run itself goes red instead.
  #
  # WHY IT DOES MORE THAN `--version`. A version string proves an entry point exists and nothing
  # else. So this also mutates a two-line scratch file with `--dry-run` (no Godot, no network),
  # which only works if the console script resolved, `gdtoolkit` and `lark` installed and imported,
  # and the GDScript parser loaded real source. Those are the failures a wheel actually ships. It
  # costs one extra second.
  #
  # ISOLATION. The checkout goes into `release-gate/` and is only the source of the script; the
  # install happens in a throwaway venv inside a temp directory outside the workspace, and every
  # subprocess runs with its working directory set there. The script then asks the installed
  # interpreter where `gdmutant` was imported from and fails unless the answer is inside that venv
  # -- otherwise a checkout on the path could satisfy this check while the upload shipped nothing.
  #
  # NO PRIVILEGE. `contents: read`, no `id-token`, no environment. It installs from an index and
  # runs a CLI on a file it wrote itself; it cannot publish, tag, or change any state.
  verify-published:
    name: Verify the published package installs and runs
    needs: [provenance, publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          path: release-gate # never the working directory of anything below
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The tag, not a separate version input: check_release_tag.py (guard 1) has already refused
      # this release unless the tag equals the packaged version, so the tag IS the version and
      # there is no second place for the two to disagree. Exit 3 means the index has not propagated
      # yet, which the script reports as propagation rather than as a broken package -- re-run the
      # job rather than going looking for a defect that is not there.
      - name: Install the published version from PyPI and run it
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: python3 release-gate/scripts/check_published_package.py --version "$TAG_NAME"
