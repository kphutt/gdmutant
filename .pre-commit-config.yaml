# Standard pre-commit config (https://pre-commit.com) — self-contained, so any clone (yours or a
# contributor's) gets the same checks with `pre-commit install --hook-type pre-commit --hook-type
# pre-push`.
#
# NOT JUST A CONVENIENCE ANYMORE (ADR-0012). ci.yml is `workflow_dispatch`-only while this repo is
# private — these hooks are the ONLY merge-time gate there is; nothing mechanical stops a bad
# commit from reaching `main` if they're skipped or not installed. The authoritative, unbypassable
# check is publish.yml's release-time gate (runs live, in the cloud, on the exact commit, every
# real release) — not GitHub Actions running on every push, which is what this comment used to say
# and is no longer true. If ci.yml's automatic triggers come back (e.g. once this repo is public),
# these hooks return to being a convenience mirror rather than the only gate.
#
# Three stages:
#   - pre-commit (every commit): gitleaks only — cheap, catches a secret before it's even committed.
#   - pre-push (before it leaves the machine): every Verify command except the test suite, mirrored
#     1:1 from ci.yml so local and CI can't drift apart: the same commands, not a reimplementation.
#     Measured together at six seconds.
#   - manual (you run it): the test suite, plus the Godot self-tests and the mutation check.
#
# Why the suite is not a push hook. It is the only slow leg: 35 seconds on the maintainer's machine
# and 2:40 measured elsewhere, against six seconds for everything else combined. That is long enough
# to exceed the tool timeout an automated contributor runs under, and a gate that reliably times out
# is a gate that gets bypassed with `--no-verify`. The bypass is silent and it skips EVERY hook,
# including the secret scan, so an honest split beats a theoretical one. Run it before you open a
# pull request, with the one command that runs the whole Verify job, tests included:
#
#   uv run python scripts/verify_local.py
#
# (or `uv run pytest` for the suite alone, or `pre-commit run --hook-stage manual pytest`).
# `tests/test_local_check_parity.py` pins this split: the suite is the single named exemption there,
# and it must still exist as a manual-stage hook running ci.yml's own command.
#
# always_run: true on every hook — these mirror CI's Verify job, which always runs the full suite
# regardless of which files changed, so file-based filtering here would silently under-check.
#
# The gitleaks/selftest/mutation hooks dispatch through Python (scripts/*.py), not shell — invoked
# directly as `python scripts/....py` rather than relying on a shebang, since a shebang line can't be
# resolved on Windows (no literal /bin/sh or /usr/bin/env path). The toolchain/lint/type/test hooks
# call `uv` directly (uv is the pinned toolchain — see pyproject's [tool.uv]).
#
# `python`, NOT `python3` — measured on Windows 11 (flagged in review, then verified from a Windows
# session): `python3` resolves ONLY via the Microsoft Store alias, and to a DIFFERENT interpreter
# than `python` (3.13.14 vs 3.13.3 on the same box). Worse, on a machine without Store Python that
# alias still exists and LAUNCHES THE MICROSOFT STORE rather than running anything — hanging every
# hook here on a stock python.org install. python.org ships `python.exe`; uv provides `python` as
# well, and CONTRIBUTING.md requires it.
#
# One further gap this closes, found live in review: a fresh clone with no local `gitleaks`
# binary got the pre-commit-stage hook failing with "gitleaks: command not found" -- that script
# degrades gracefully instead of hard-requiring the tool.
default_stages: [pre-push]

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan; skips gracefully if gitleaks isn't installed)
        entry: python scripts/run_gitleaks.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: toolchain-sync
        name: toolchain sync (uv)
        entry: uv sync --frozen
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: gdlint
        name: gdlint (corpus fixture)
        entry: uv run gdlint corpus/turn_order.gd corpus/test corpus/gut_test corpus/harness
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy gdmutant
        language: system
        pass_filenames: false
        always_run: true

      # Deliberately NOT at the push stage. See the header for why, and
      # `tests/test_local_check_parity.py`'s DEFERRED_TO_MANUAL_STAGE for the exemption that lets
      # the local-vs-CI parity check stay strict about everything else.
      - id: pytest
        name: pytest (manual, the slow leg of Verify)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true

      # Mirrors ci.yml's license-check job (ADR-0012). That job's own first step is `uv sync
      # --frozen --no-dev` — fine in CI (a throwaway runner), but running it against the SHARED
      # `.venv` uninstalls pre-commit itself mid-hook, which fails outright on Windows ("failed to
      # remove file ...pre-commit.exe: The process cannot access the file" — found live). The
      # wrapper redirects to an isolated `.venv-license-check` (gitignored) instead, so the shared
      # venv this hook chain is running out of is never touched.
      - id: license-check
        name: license compliance (mirrors ci.yml's license-check job)
        entry: python scripts/license_check_local.py
        language: python
        pass_filenames: false
        always_run: true

      # Opt-in, not run automatically (needs a real Godot binary) — mirrors ci.yml's
      # selftest-godot job. Run by hand: `pre-commit run --hook-stage manual gdmutant-selftest`
      - id: gdmutant-selftest
        name: Godot self-test (manual, requires a real Godot binary)
        entry: python scripts/run_selftest.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [manual]

      # The GUT peer of gdmutant-selftest — mirrors ci.yml's selftest-gut job (installs the pinned
      # GUT addon, runs the GUT leg). Run by hand: `pre-commit run --hook-stage manual gdmutant-selftest-gut`
      - id: gdmutant-selftest-gut
        name: GUT self-test (manual, requires a real Godot binary)
        entry: python scripts/run_selftest_gut.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [manual]

      # Opt-in, advisory, not run automatically — mirrors mutation.yml's baseline-failure guard
      # (a surviving mutant is fine; a baseline that won't run clean unmutated is not). Local uses
      # poodle, not mutmut (which has no native Windows support) — see docs/decisions/0013.
      - id: gdmutant-mutation
        name: poodle, diff-scoped vs origin/main (advisory, manual)
        entry: python scripts/check_mutation_baseline.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [manual]
