# Mutation-testing config for poodle (https://poodle.readthedocs.io) — measures mutants inside
# class-method bodies that mutmut (CI's tool) structurally can't generate at all; see
# docs/decisions/0013-windows-local-mutation-testing.md for why this exists and why it's poodle.
#
# poodle mutates a temp copy of the whole repo (never the real tree in place), so a killed run
# can't leave a mutation on disk the way an in-place tool can. `only_files` is left unset here —
# scripts/check_mutation_baseline.py passes `--only <file>` per file changed vs origin/main, plus a
# mutant cap (default 50 -- see GDMUTANT_MUTATION_BASELINE_MAX_MUTANTS in that script), so a local
# run stays inside single-digit minutes even when a changed file is almost entirely string literals
# (every literal is its own mutant), not the ~100 minutes a full-package sweep would take. That
# script measured this repo's real per-mutant rate on a Windows dev machine at about 6 seconds
# (slower than the ~2.3s/mutant this comment used to cite, which was not a Windows measurement --
# process-spawn overhead per mutant runs higher here, the same reason mutmut has no native Windows
# support at all). A change over the cap prints which files it dropped instead of running long
# with no output -- PR #186's diff included gdmutant/engine/survivor_reference.py this way and ran
# about fifty minutes before the environment killed it.

[poodle]
source_folders = ["."]

# wcmatch's default glob skips dotfiles/dot-dirs; without DOTGLOB, .github/ and
# .pre-commit-config.yaml never make it into the temp copy, and any test that reads them (e.g.
# test_check_release_tag.py) fails from a missing file, not from the mutation itself.
file_copy_flags = 16704  # GLOBSTAR (256) | DOTGLOB (64) | NODIR (16384)
file_copy_filters = [
    "__pycache__/**",
    ".venv/**",
    ".venv-license-check/**",
    ".git/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".poodle-temp/**",
    "mutants/**",
    ".coverage",
]

[poodle.runner_opts]
# --ignore, not `-m "not ..."`: this repo registers no such marks (grep tests/ for
# pytest.mark.real_godot / real_gdunit4 / live comes up empty), so an `-m` expression naming them
# is a silent no-op -- pytest treats an unknown mark in a `-m` filter as matching nothing, which
# excludes zero tests. The two live-Godot suites are gated by GDMUTANT_GODOT / GDMUTANT_GDUNIT4_CLONE
# env-var skipif, not marks (see their own module docstrings), so excluding them by path is what
# actually keeps a mutation sweep from shelling out to real Godot once per mutant on a machine
# where those env vars happen to be set for other work -- exactly this PR's target persona.
command_line = "pytest -x -q --no-cov -p no:cacheprovider --ignore=tests/test_selftest_live.py --ignore=tests/test_dogfood_gdunit4.py -o pythonpath='{PYTHONPATH}'"
